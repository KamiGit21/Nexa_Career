services:
  # ==========================================
  # API GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa_api_gateway
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "src/backend/api-gateway/index.js"]
    networks:
      - nexa_network

  # ==========================================
  # MICROSERVICIOS BACKEND
  # ==========================================
  servicio-carrera:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa_servicio_carrera
    ports:
      - "3002:3002"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "src/backend/servicioCarrera/APICarrera/indexCarrera.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexa_network

  servicio-estudiante:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa_servicio_estudiante
    ports:
      - "3003:3003"
    env_file:
      - .env
    volumes:
      - ./src/backend/servicioEstudiante/uploads:/app/src/backend/servicioEstudiante/uploads
      - .:/app
      - /app/node_modules
    command: ["node", "src/backend/servicioEstudiante/APIEstudiante/indexEstudiante.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexa_network

  servicio-empleador:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa_servicio_empleador
    ports:
      - "3004:3004"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "src/backend/servicioEmpleador/APIEmpleador/indexEmpleador.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexa_network

  servicio-supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa_servicio_supervisor
    ports:
      - "3005:3005"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "src/backend/servicioSupervisor/APISupervisor/indexSupervisor.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexa_network

  servicio-oferta:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa_servicio_oferta
    ports:
      - "3006:3006"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "src/backend/servicioOferta/APIOferta/indexOferta.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexa_network

  servicio-ofertante:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa_servicio_ofertante
    ports:
      - "3007:3007"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "src/backend/servicioOfertante/APIOfertante/indexOfertante.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexa_network

  servicio-curso:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa_servicio_curso
    ports:
      - "3008:3008"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "src/backend/servicioCurso/APICurso/indexCurso.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexa_network

  servicio-categoria:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexa_servicio_categoria
    ports:
      - "3009:3009"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: ["node", "src/backend/servicioCategoria/APICategoria/indexCategoria.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nexa_network

  # ==========================================
  # FRONTEND (VITE)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: nexa_frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - nexa_network

networks:
  nexa_network:
    driver: bridge